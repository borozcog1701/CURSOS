<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Árboles AVL · Estructura de Datos · UAEMéx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --forest-dark: #1B3A2F;
  --forest: #2C5F2D;
  --moss: #97BC62;
  --moss-light: #C8DDA0;
  --cream: #F8F5EC;
  --cream-2: #FFFFFF;
  --charcoal: #2B2B2B;
  --gray: #5C6B5F;
  --gray-light: #D9DDD3;
  --accent: #D9822B;
  --accent-soft: #F0C896;
  --red: #B33A3A;
  --ok: #3D8A4E;

  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Consolas', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--font-body);
  background: var(--cream);
  color: var(--charcoal);
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at top right, rgba(151, 188, 98, 0.08), transparent 50%),
    radial-gradient(ellipse at bottom left, rgba(44, 95, 45, 0.05), transparent 50%),
    var(--cream);
}

/* ====================== TOP BAR ====================== */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: var(--forest-dark);
  color: var(--cream);
  border-bottom: 3px solid var(--moss);
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 14px;
}
.brand-logo {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.brand-logo svg { width: 100%; height: 100%; fill: var(--moss); }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.02em;
}
.brand-sub {
  font-size: 11px;
  color: var(--moss-light);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.progress-info {
  display: flex;
  align-items: center;
  gap: 18px;
}
.progress-pill {
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 6px 14px;
  background: rgba(151, 188, 98, 0.15);
  border: 1px solid var(--moss);
  border-radius: 999px;
  color: var(--moss-light);
  letter-spacing: 0.08em;
}
.progress-bar-outer {
  width: 220px;
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 999px;
  overflow: hidden;
}
.progress-bar-inner {
  height: 100%;
  background: linear-gradient(90deg, var(--moss), var(--accent));
  border-radius: 999px;
  transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ====================== MAIN STAGE ====================== */
.stage {
  flex: 1;
  display: flex;
  position: relative;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 240px;
  background: var(--cream-2);
  border-right: 1px solid var(--gray-light);
  overflow-y: auto;
  flex-shrink: 0;
  scrollbar-width: thin;
  scrollbar-color: var(--moss) transparent;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--moss); border-radius: 3px; }

.sidebar-title {
  padding: 16px 18px 8px;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--gray);
  font-weight: 600;
}
.toc-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 18px;
  cursor: pointer;
  font-size: 13px;
  color: var(--charcoal);
  border-left: 3px solid transparent;
  transition: all 0.18s;
  position: relative;
}
.toc-item:hover {
  background: var(--moss-light);
  color: var(--forest-dark);
}
.toc-item.active {
  background: linear-gradient(90deg, var(--moss-light), transparent);
  border-left-color: var(--forest);
  color: var(--forest-dark);
  font-weight: 600;
}
.toc-num {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gray);
  width: 22px;
  flex-shrink: 0;
}
.toc-item.active .toc-num { color: var(--forest); font-weight: 700; }
.toc-item.quiz {
  background: rgba(217, 130, 43, 0.08);
  border-top: 1px dashed var(--gray-light);
  margin-top: 4px;
}
.toc-item.quiz .toc-num { color: var(--accent); }
.toc-item.quiz.active {
  background: linear-gradient(90deg, rgba(217, 130, 43, 0.18), transparent);
  border-left-color: var(--accent);
  color: var(--accent);
}
.toc-icon {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  opacity: 0.6;
}
.toc-item.active .toc-icon { opacity: 1; }

/* Slide canvas */
.canvas {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 28px 60px;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
}
.slide {
  width: 100%;
  max-width: 1100px;
  background: var(--cream-2);
  border-radius: 16px;
  box-shadow:
    0 1px 3px rgba(27, 58, 47, 0.06),
    0 12px 40px rgba(27, 58, 47, 0.08);
  padding: 48px 56px;
  position: relative;
  min-height: 540px;
  animation: slideIn 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
.slide::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 5px;
  background: linear-gradient(to bottom, var(--forest), var(--moss));
  border-radius: 16px 0 0 16px;
}
.slide-num {
  position: absolute;
  top: 22px;
  right: 28px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--gray);
  letter-spacing: 0.1em;
}

/* Slide content typography */
.slide h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 36px;
  color: var(--forest-dark);
  line-height: 1.1;
  margin-bottom: 8px;
  letter-spacing: -0.01em;
}
.slide h1 .accent-line {
  display: block;
  width: 64px;
  height: 4px;
  background: var(--accent);
  margin-top: 14px;
  border-radius: 2px;
}
.slide .subtitle {
  font-size: 15px;
  color: var(--gray);
  font-style: italic;
  margin-bottom: 28px;
  max-width: 800px;
}
.slide h2 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  color: var(--forest-dark);
  margin-bottom: 14px;
}
.slide h3 {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 17px;
  color: var(--forest);
  margin-bottom: 8px;
}
.slide p { line-height: 1.6; font-size: 14.5px; margin-bottom: 12px; }
.slide ul { margin: 8px 0 14px 20px; }
.slide ul li {
  line-height: 1.7;
  font-size: 14px;
  padding-left: 6px;
  margin-bottom: 4px;
}
.slide ul li::marker { color: var(--forest); font-weight: 700; }

.slide .grid { display: grid; gap: 18px; }
.slide .grid.two { grid-template-columns: 1fr 1fr; }
.slide .grid.three { grid-template-columns: 1fr 1fr 1fr; }

.card {
  background: var(--cream-2);
  border: 1px solid var(--gray-light);
  border-radius: 10px;
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}
.card.tinted { background: linear-gradient(135deg, #fafaf3, #fff); }
.card-strip {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 4px;
  background: var(--forest);
}
.card.accent .card-strip { background: var(--accent); }
.card.red .card-strip { background: var(--red); }
.card.ok .card-strip { background: var(--ok); }

.code-block {
  background: var(--forest-dark);
  color: var(--moss-light);
  font-family: var(--font-mono);
  font-size: 12.5px;
  padding: 16px 20px;
  border-radius: 8px;
  line-height: 1.55;
  overflow-x: auto;
  white-space: pre;
}
.code-block .kw { color: var(--moss); font-weight: 600; }
.code-block .cm { color: var(--accent-soft); font-style: italic; }

.formula {
  background: var(--forest-dark);
  color: var(--moss);
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 600;
  padding: 14px 20px;
  border-radius: 8px;
  text-align: center;
  letter-spacing: 0.02em;
}

.tag {
  display: inline-block;
  padding: 4px 11px;
  background: var(--forest);
  color: var(--cream-2);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.tag.accent { background: var(--accent); }
.tag.red { background: var(--red); }
.tag.ok { background: var(--ok); }

.note-box {
  background: var(--moss-light);
  border-left: 4px solid var(--moss);
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  font-size: 13px;
  color: var(--forest-dark);
  margin: 12px 0;
  display: flex;
  align-items: center;
  gap: 10px;
}
.note-box .icon { font-size: 18px; }

.comparison-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  margin: 12px 0;
  font-size: 13.5px;
}
.comparison-table th {
  background: var(--forest-dark);
  color: var(--cream-2);
  padding: 10px 14px;
  text-align: left;
  font-weight: 600;
}
.comparison-table th:first-child { border-radius: 8px 0 0 0; }
.comparison-table th:last-child { border-radius: 0 8px 0 0; }
.comparison-table td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--gray-light);
  font-family: var(--font-mono);
}
.comparison-table tr:nth-child(even) td { background: rgba(151, 188, 98, 0.06); }
.comparison-table .label { font-family: var(--font-body); font-weight: 600; color: var(--charcoal); }

/* SVG tree containers */
.tree-svg {
  width: 100%;
  max-width: 100%;
}

/* Big numbers */
.big-num {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 64px;
  color: var(--forest);
  line-height: 1;
}
.big-num.accent { color: var(--accent); }

/* ====================== NAVIGATION ====================== */
.nav-arrows {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--cream-2);
  border: 1px solid var(--gray-light);
  cursor: pointer;
  font-size: 20px;
  color: var(--forest);
  box-shadow: 0 4px 14px rgba(27,58,47,0.1);
  transition: all 0.2s;
  z-index: 10;
}
.nav-arrows:hover {
  background: var(--forest);
  color: var(--cream-2);
  transform: translateY(-50%) scale(1.08);
}
.nav-arrows:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}
.nav-prev { left: 12px; }
.nav-next { right: 12px; }

.bottombar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 10px 28px;
  background: var(--cream-2);
  border-top: 1px solid var(--gray-light);
  flex-shrink: 0;
}
.dot-nav {
  display: flex;
  gap: 5px;
  align-items: center;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--gray-light);
  cursor: pointer;
  transition: all 0.2s;
}
.dot.active {
  background: var(--forest);
  width: 22px;
  border-radius: 4px;
}
.dot.quiz { background: var(--accent-soft); }
.dot.quiz.active { background: var(--accent); }
.dot:hover { transform: scale(1.3); }
.kbd-hint {
  font-size: 11px;
  color: var(--gray);
  font-family: var(--font-mono);
}
.kbd {
  display: inline-block;
  padding: 1px 6px;
  background: var(--gray-light);
  border-radius: 3px;
  font-size: 10px;
  margin: 0 2px;
}

/* ====================== QUIZ ====================== */
.quiz-intro { text-align: center; padding: 40px 20px; }
.quiz-intro .icon-circle {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #c46c1d);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  font-size: 36px;
  color: var(--cream-2);
  box-shadow: 0 8px 24px rgba(217, 130, 43, 0.3);
}
.quiz-intro h1 { font-size: 42px; margin-bottom: 12px; }
.quiz-intro .lead {
  font-size: 16px;
  color: var(--gray);
  max-width: 620px;
  margin: 0 auto 32px;
  line-height: 1.6;
}
.quiz-meta {
  display: flex;
  justify-content: center;
  gap: 32px;
  margin: 24px 0 36px;
}
.quiz-meta .meta-item { text-align: center; }
.quiz-meta .meta-val {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 36px;
  color: var(--forest);
}
.quiz-meta .meta-lbl {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--gray);
}

.quiz-question-container {
  padding: 20px 0;
}
.quiz-progress {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  font-size: 12px;
  color: var(--gray);
}
.quiz-progress-bar {
  flex: 1;
  height: 4px;
  background: var(--gray-light);
  margin: 0 16px;
  border-radius: 2px;
  overflow: hidden;
}
.quiz-progress-bar > div {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.4s ease;
}
.quiz-progress .pill {
  font-family: var(--font-mono);
  padding: 4px 10px;
  background: var(--cream);
  border-radius: 999px;
}

.quiz-card {
  background: var(--cream-2);
  border: 1px solid var(--gray-light);
  border-radius: 12px;
  padding: 28px 32px;
  margin-bottom: 20px;
}
.quiz-card .topic-tag {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 8px;
  font-weight: 700;
}
.quiz-card .question {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  color: var(--forest-dark);
  margin-bottom: 8px;
  line-height: 1.3;
}
.quiz-card .question-detail {
  font-size: 13.5px;
  color: var(--gray);
  margin-bottom: 18px;
}
.quiz-options { display: flex; flex-direction: column; gap: 10px; }
.quiz-option {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 18px;
  background: var(--cream);
  border: 2px solid transparent;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
  font-size: 14px;
  line-height: 1.5;
  color: var(--charcoal);
  text-align: left;
}
.quiz-option:hover {
  background: var(--moss-light);
  transform: translateX(4px);
}
.quiz-option.selected {
  background: var(--moss-light);
  border-color: var(--forest);
}
.quiz-option .letter {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--cream-2);
  border: 2px solid var(--gray-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 13px;
  color: var(--gray);
  flex-shrink: 0;
  transition: all 0.15s;
}
.quiz-option.selected .letter {
  background: var(--forest);
  border-color: var(--forest);
  color: var(--cream-2);
}
.quiz-option.correct {
  background: rgba(61, 138, 78, 0.12);
  border-color: var(--ok);
}
.quiz-option.correct .letter { background: var(--ok); border-color: var(--ok); color: white; }
.quiz-option.incorrect {
  background: rgba(179, 58, 58, 0.1);
  border-color: var(--red);
}
.quiz-option.incorrect .letter { background: var(--red); border-color: var(--red); color: white; }
.quiz-option:disabled { cursor: default; }
.quiz-option:disabled:hover { transform: none; }

.feedback-box {
  margin-top: 16px;
  padding: 14px 18px;
  border-radius: 10px;
  font-size: 13.5px;
  line-height: 1.6;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.feedback-box.ok {
  background: rgba(61, 138, 78, 0.1);
  border-left: 4px solid var(--ok);
  color: var(--forest-dark);
}
.feedback-box.bad {
  background: rgba(179, 58, 58, 0.08);
  border-left: 4px solid var(--red);
  color: var(--charcoal);
}
.feedback-box strong { display: block; margin-bottom: 4px; font-size: 13px; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  background: var(--forest);
  color: var(--cream-2);
  border: none;
  border-radius: 8px;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.02em;
}
.btn:hover { background: var(--forest-dark); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(27,58,47,0.2); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn.accent { background: var(--accent); }
.btn.accent:hover { background: #c46c1d; }
.btn.outline {
  background: transparent;
  color: var(--forest);
  border: 2px solid var(--forest);
}
.btn.outline:hover { background: var(--forest); color: var(--cream-2); }

.quiz-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 18px;
}
.quiz-actions .left { display: flex; gap: 10px; }

/* ====================== RESULTS ====================== */
.results { text-align: center; padding: 20px 20px 40px; }
.score-display {
  position: relative;
  width: 200px;
  height: 200px;
  margin: 12px auto 24px;
}
.score-display svg { transform: rotate(-90deg); }
.score-display .track { fill: none; stroke: var(--gray-light); stroke-width: 14; }
.score-display .progress {
  fill: none;
  stroke-width: 14;
  stroke-linecap: round;
  transition: stroke-dashoffset 1.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.score-text {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-percentage {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 54px;
  line-height: 1;
}
.score-grade-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--gray);
  margin-top: 6px;
}
.score-message {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 700;
  color: var(--forest-dark);
  margin-bottom: 6px;
}
.score-detail {
  color: var(--gray);
  font-size: 15px;
  margin-bottom: 22px;
}

.breakdown {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  max-width: 600px;
  margin: 0 auto 24px;
}
.breakdown-item {
  background: var(--cream);
  border: 1px solid var(--gray-light);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
}
.breakdown-item .num {
  font-family: var(--font-display);
  font-weight: 900;
  font-size: 30px;
  line-height: 1;
}
.breakdown-item.ok .num { color: var(--ok); }
.breakdown-item.bad .num { color: var(--red); }
.breakdown-item.total .num { color: var(--forest); }
.breakdown-item .lbl {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--gray);
  margin-top: 6px;
}

.review-section {
  text-align: left;
  max-width: 760px;
  margin: 28px auto 0;
}
.review-section h3 {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--forest-dark);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--gray-light);
}
.review-item {
  background: var(--cream);
  border-left: 4px solid var(--ok);
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  margin-bottom: 10px;
  font-size: 13px;

<script>

  cream: '#F8F5EC', white: '#FFFFFF', charcoal: '#2B2B2B', gray: '#5C6B5F',
  grayLight: '#D9DDD3', accent: '#D9822B', red: '#B33A3A', ok: '#3D8A4E'
};

// SVG helpers ---------------------------------------------------------
function node(cx, cy, label, opts = {}) {
  const r = opts.r ?? 22;
  const border = opts.border ?? C.forest;
  const fill = opts.fill ?? C.white;
  const fb = opts.fb;
  let fbLabel = '';
  if (typeof fb === 'number') {
    const sign = fb > 0 ? '+' : '';
    const color = Math.abs(fb) > 1 ? C.red : C.ok;
    fbLabel = `<text x="${cx + r + 4}" y="${cy + 3}" fill="${color}" font-size="11" font-family="JetBrains Mono, monospace" font-weight="600">FB=${sign}${fb}</text>`;
  }
  return `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${border}" stroke-width="2.5"/>
    <text x="${cx}" y="${cy + 5}" fill="${C.forestDark}" text-anchor="middle" font-size="${opts.fontSize || 14}" font-weight="700" font-family="Fraunces, serif">${label}</text>
    ${fbLabel}
  `;
}
function edge(x1, y1, x2, y2) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.forest}" stroke-width="2"/>`;
}
function subtree(x, y, label, w = 28, h = 22) {
  return `
    <rect x="${x - w/2}" y="${y - h/2}" width="${w}" height="${h}" fill="${C.grayLight}" stroke="${C.gray}" stroke-width="1"/>
    <text x="${x}" y="${y + 4}" fill="${C.gray}" text-anchor="middle" font-size="10" font-family="Inter, sans-serif">${label}</text>
  `;
}
function arrow(x, y, label, color = C.accent) {
  return `
    <g transform="translate(${x}, ${y})">
      <polygon points="0,-12 26,0 0,12" fill="${color}" opacity="0.85"/>
      <text x="13" y="28" fill="${color}" text-anchor="middle" font-size="11" font-style="italic" font-weight="600" font-family="Inter">${label}</text>
    </g>
  `;
}

// =====================================================================
// SLIDES DATA

const slides = [];

// ─── 2. AGENDA ────────────────────────────────────────────────────────

// ─── 3. ORIGEN Y MOTIVACIÓN ───────────────────────────────────────────
slides.push({
  title: 'Origen y motivación',
  type: 'lesson',
  html: () => `
    <h1>Origen y motivación <span class="accent-line"></span></h1>
    <p class="subtitle">¿Por qué un BST común no siempre nos sirve?</p>
    <div class="grid two">

      </div>

// ─── 4. DEFINICIÓN FORMAL ─────────────────────────────────────────────
slides.push({

  type: 'lesson',
  html: () => `
    <h1>Definición formal <span class="accent-line"></span></h1>
    <p class="subtitle">¿Qué es exactamente un árbol AVL?</p>
    <p style="background: ${C.cream}; padding: 16px 20px; border-radius: 10px; border-left: 4px solid ${C.forest}; margin-bottom: 22px;">
      Un <strong>árbol AVL</strong> es un <strong>árbol binario de búsqueda</strong> en el que, para <em>cada nodo</em>, las alturas de sus dos subárboles difieren <strong>como máximo en 1</strong>.
    </p>
    <div class="grid three">
      <div class="card">
        <div class="card-strip"></div>
        <h3>📏 Altura h(v)</h3>
        <p style="font-size: 13.5px;">Número de aristas en el camino más largo desde el nodo hasta una hoja. Por convención, h(nulo) = −1 y h(hoja) = 0.</p>
      </div>
      <div class="card accent">
        <div class="card-strip"></div>
        <h3>⚖️ Factor de balance</h3>
        <p style="font-size: 13.5px;">FB(v) = h(izq) − h(der). En un AVL válido siempre se cumple: <strong style="color: ${C.ok};">|FB(v)| ≤ 1</strong>.</p>

      <div class="card ok">
        <div class="card-strip"></div>
        <h3>🔄 Auto-balanceo</h3>

      </div>

    <div class="note-box" style="margin-top: 18px;"><span class="icon">🔑</span><strong style="margin-right: 6px;">Invariante AVL:</strong> ∀ nodo v, |h(izq(v)) − h(der(v))| ≤ 1</div>
  `
});

          <li style="padding: 6px 0;"><strong style="color: ${C.ok};">FB = −1</strong> → el derecho es más alto por 1.</li>

        </ul>

        <h3 style="text-align: center;">Ejemplo: ¿está balanceado?</h3>

// ─── 15. ALGORITMO DE INSERCIÓN ──────────────────────────────────────
slides.push({
  title: 'Algoritmo de inserción',
  type: 'lesson',
  html: () => `
    <h1>Algoritmo de inserción <span class="accent-line"></span></h1>
    <p class="subtitle">Inserción + rebalanceo en pseudocódigo Python</p>
    <div class="grid two">
      <div>
        <h3>Pasos del algoritmo</h3>
        <ol style="padding-left: 22px; margin-top: 8px;">
          <li style="padding: 5px 0; font-size: 14px;"><strong>Inserción BST estándar</strong> según la clave.</li>
          <li style="padding: 5px 0; font-size: 14px;"><strong>Actualizar altura</strong> del nuevo nodo y sus ancestros.</li>
          <li style="padding: 5px 0; font-size: 14px;"><strong>Calcular FB</strong> en cada ancestro al regresar.</li>
          <li style="padding: 5px 0; font-size: 14px;">Si |FB| &gt; 1, identificar caso (LL/RR/LR/RL).</li>
          <li style="padding: 5px 0; font-size: 14px;"><strong>Aplicar rotación</strong> correspondiente.</li>
          <li style="padding: 5px 0; font-size: 14px;">Retornar la nueva raíz del subárbol.</li>
        </ol>
        <div class="note-box"><span class="icon">⚡</span>En inserción basta con <strong>una rotación</strong> para restaurar el balance.</div>
      </div>
      <div class="code-block" style="font-size: 11.5px;"><span class="kw">def</span> insertar(nodo, clave):
    <span class="cm"># 1. Inserción BST normal</span>
    <span class="kw">if</span> nodo <span class="kw">is None</span>:
        <span class="kw">return</span> Nodo(clave)
    <span class="kw">if</span> clave &lt; nodo.clave:
        nodo.izq = insertar(nodo.izq, clave)
    <span class="kw">else</span>:
        nodo.der = insertar(nodo.der, clave)

    <span class="cm"># 2. Actualizar altura</span>
    nodo.altura = 1 + max(h(nodo.izq), h(nodo.der))

    <span class="cm"># 3. Calcular FB</span>
    fb = h(nodo.izq) − h(nodo.der)

    <span class="cm"># 4. LL</span>
    <span class="kw">if</span> fb &gt; 1 <span class="kw">and</span> clave &lt; nodo.izq.clave:
        <span class="kw">return</span> rotarDerecha(nodo)
    <span class="cm"># RR</span>
    <span class="kw">if</span> fb &lt; −1 <span class="kw">and</span> clave &gt; nodo.der.clave:
        <span class="kw">return</span> rotarIzquierda(nodo)
    <span class="cm"># LR</span>
    <span class="kw">if</span> fb &gt; 1 <span class="kw">and</span> clave &gt; nodo.izq.clave:
        nodo.izq = rotarIzquierda(nodo.izq)
        <span class="kw">return</span> rotarDerecha(nodo)
    <span class="cm"># RL</span>
    <span class="kw">if</span> fb &lt; −1 <span class="kw">and</span> clave &lt; nodo.der.clave:
        nodo.der = rotarDerecha(nodo.der)
        <span class="kw">return</span> rotarIzquierda(nodo)
    <span class="kw">return</span> nodo</div>
    </div>
  `
});

const progressBar = document.getElementById('progressBar');
const progressPill = document.getElementById('progressPill');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const dotNav = document.getElementById('dotNav');
const modeIndicator = document.getElementById('modeIndicator');

function buildSidebar() {
  let html = '<div class="sidebar-title">Lección</div>';
  slides.forEach((s, i) => {
    const num = String(i + 1).padStart(2, '0');
    html += `<div class="toc-item" data-idx="${i}"><span class="toc-num">${num}</span><span>${s.title}</span></div>`;
  });
  html += '<div class="sidebar-title" style="margin-top: 12px;">Evaluación</div>';
  html += `<div class="toc-item quiz" data-idx="${QUIZ_INTRO_IDX}"><span class="toc-num">📝</span><span>Quiz introducción</span></div>`;
  quizQuestions.forEach((_, i) => {
    html += `<div class="toc-item quiz" data-idx="${FIRST_QUIZ_Q_IDX + i}"><span class="toc-num">Q${i + 1}</span><span>Pregunta ${i + 1}</span></div>`;
  });
  html += `<div class="toc-item quiz" data-idx="${RESULTS_IDX}"><span class="toc-num">🏆</span><span>Resultados</span></div>`;
  sidebarEl.innerHTML = html;
  sidebarEl.querySelectorAll('.toc-item').forEach(el => {
    el.addEventListener('click', () => navigateTo(parseInt(el.dataset.idx)));
  });
}

function buildDots() {
  let html = '';
  for (let i = 0; i < TOTAL_SCREENS; i++) {
    const isQuiz = i >= QUIZ_INTRO_IDX;
    html += `<div class="dot ${isQuiz ? 'quiz' : ''}" data-idx="${i}"></div>`;
  }
  dotNav.innerHTML = html;
  dotNav.querySelectorAll('.dot').forEach(el => {
    el.addEventListener('click', () => navigateTo(parseInt(el.dataset.idx)));
  });
}

function updateProgress() {
  const pct = ((currentSlide + 1) / TOTAL_SCREENS) * 100;
  progressBar.style.width = pct + '%';
  const cur = String(currentSlide + 1).padStart(2, '0');
  const tot = String(TOTAL_SCREENS).padStart(2, '0');
  progressPill.textContent = `${cur} / ${tot}`;

  // Sidebar active
  sidebarEl.querySelectorAll('.toc-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === currentSlide);
  });
  // Dots
  dotNav.querySelectorAll('.dot').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.idx) === currentSlide);
  });
  // Mode indicator
  modeIndicator.textContent = currentSlide < QUIZ_INTRO_IDX ? 'Lección' : (currentSlide === RESULTS_IDX ? 'Resultados' : 'Quiz');
  // Disable buttons at ends
  prevBtn.disabled = currentSlide === 0;
  nextBtn.disabled = currentSlide === TOTAL_SCREENS - 1;
}

function renderSlide() {
  // Scroll back to top of canvas
  document.getElementById('canvas').scrollTop = 0;

  if (currentSlide < totalSlides) {
    // Lesson slide
    slideEl.innerHTML = slides[currentSlide].html();
  } else if (currentSlide === QUIZ_INTRO_IDX) {
    slideEl.innerHTML = renderQuizIntro();
  } else if (currentSlide >= FIRST_QUIZ_Q_IDX && currentSlide < RESULTS_IDX) {
    const qi = currentSlide - FIRST_QUIZ_Q_IDX;
    slideEl.innerHTML = renderQuestion(qi);
    attachQuestionHandlers(qi);
  } else if (currentSlide === RESULTS_IDX) {
    slideEl.innerHTML = renderResults();
    attachResultsHandlers();
  }
  updateProgress();
}

function navigateTo(idx) {
  if (idx < 0 || idx >= TOTAL_SCREENS) return;
  // Force user to land on RESULTS only after submitting
  if (idx === RESULTS_IDX && !quizState.submitted) {
    // Allow nav through sidebar, but show a partial state — that's ok; results render handles unanswered.
  }
  currentSlide = idx;
  renderSlide();
}

prevBtn.addEventListener('click', () => navigateTo(currentSlide - 1));
nextBtn.addEventListener('click', () => navigateTo(currentSlide + 1));
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') navigateTo(currentSlide + 1);
  else if (e.key === 'ArrowLeft') navigateTo(currentSlide - 1);
  else if (e.key === 'Home') navigateTo(0);
  else if (e.key === 'End') navigateTo(TOTAL_SCREENS - 1);
});

// =====================================================================
// QUIZ RENDERING
// =====================================================================

function renderQuizIntro() {
  const answered = quizState.locked.filter(Boolean).length;
  return `
    <div class="quiz-intro">
      <div class="icon-circle">📝</div>
      <h1 style="font-size: 42px;">Evaluación final<span class="accent-line" style="margin: 14px auto;"></span></h1>
      <p class="lead">Ahora pondrás a prueba lo aprendido sobre árboles AVL. Son <strong>${quizQuestions.length} preguntas</strong> de opción múltiple con retroalimentación inmediata.</p>
      <div class="quiz-meta">
        <div class="meta-item">
          <div class="meta-val">${quizQuestions.length}</div>
          <div class="meta-lbl">Preguntas</div>
        </div>
        <div class="meta-item">
          <div class="meta-val">100</div>
          <div class="meta-lbl">Pts. máximos</div>
        </div>
        <div class="meta-item">
          <div class="meta-val">60</div>
          <div class="meta-lbl">Pts. aprobar</div>
        </div>
      </div>
      <div style="background: ${C.cream}; padding: 18px 22px; border-radius: 10px; border-left: 4px solid ${C.forest}; text-align: left; max-width: 640px; margin: 0 auto 28px;">
        <h3 style="font-size: 15px;">Instrucciones</h3>
        <ul style="font-size: 13px; margin-top: 6px; color: ${C.charcoal};">
          <li>Selecciona la respuesta que consideres correcta y presiona <strong>Confirmar</strong>.</li>
          <li>Recibirás retroalimentación inmediata por cada pregunta.</li>
          <li>No podrás cambiar tu respuesta una vez confirmada.</li>
          <li>Al final verás tu calificación y un repaso de tus respuestas.</li>
        </ul>
      </div>
      ${answered > 0 ? `<p style="color: ${C.accent}; font-size: 13px; margin-bottom: 14px;">Llevas ${answered} de ${quizQuestions.length} preguntas respondidas.</p>` : ''}
      <button class="btn accent" id="startQuizBtn">${answered === 0 ? 'Empezar quiz' : 'Continuar quiz'} →</button>
    </div>
  `;
}

function renderQuestion(qi) {
  const q = quizQuestions[qi];
  const sel = quizState.answers[qi];
  const locked = quizState.locked[qi];
  const isCorrect = sel === q.correct;
  const progressPct = ((qi + 1) / quizQuestions.length) * 100;

  return `
    <div class="quiz-question-container">
      <div class="quiz-progress">
        <span class="pill">Pregunta ${qi + 1} de ${quizQuestions.length}</span>
        <div class="quiz-progress-bar"><div style="width: ${progressPct}%;"></div></div>
        <span style="font-family: var(--font-mono);">${Math.round(progressPct)}%</span>
      </div>
      <div class="quiz-card">
        <div class="topic-tag">${q.topic}</div>
        <div class="question">${q.q}</div>
        <div class="question-detail">${q.detail}</div>
        <div class="quiz-options">
          ${q.options.map((opt, i) => {
            const letter = String.fromCharCode(65 + i); // A, B, C, D
            let classes = 'quiz-option';
            if (sel === i && !locked) classes += ' selected';
            if (locked) {
              if (i === q.correct) classes += ' correct';
              else if (i === sel) classes += ' incorrect';
            }
            return `
              <button class="${classes}" data-opt="${i}" ${locked ? 'disabled' : ''}>
                <span class="letter">${letter}</span>
                <span>${opt}</span>
              </button>
            `;
          }).join('')}
        </div>
        ${locked ? `
          <div class="feedback-box ${isCorrect ? 'ok' : 'bad'}">
            <strong>${isCorrect ? '✓ ¡Correcto!' : '✗ Respuesta incorrecta'}</strong>
            ${isCorrect ? q.feedback.ok : q.feedback.bad}
          </div>
        ` : ''}
      </div>
      <div class="quiz-actions">
        <div class="left">
          <button class="btn outline" id="prevQBtn">← Anterior</button>
        </div>
        <div>
          ${!locked
            ? `<button class="btn accent" id="confirmBtn" ${sel === null ? 'disabled' : ''}>Confirmar respuesta</button>`
            : (qi === quizQuestions.length - 1
                ? `<button class="btn accent" id="finishBtn">Ver resultados →</button>`
                : `<button class="btn accent" id="nextQBtn">Siguiente pregunta →</button>`)
          }
        </div>
      </div>
    </div>
  `;
}

function attachQuestionHandlers(qi) {
  const q = quizQuestions[qi];
  const optionEls = slideEl.querySelectorAll('.quiz-option');
  optionEls.forEach(el => {
    el.addEventListener('click', () => {
      if (quizState.locked[qi]) return;
      quizState.answers[qi] = parseInt(el.dataset.opt);
      renderSlide();
    });
  });

  const prev = document.getElementById('prevQBtn');
  if (prev) prev.addEventListener('click', () => navigateTo(currentSlide - 1));

  const confirm = document.getElementById('confirmBtn');
  if (confirm) confirm.addEventListener('click', () => {
    if (quizState.answers[qi] === null) return;
    quizState.locked[qi] = true;
    renderSlide();
  });

  const next = document.getElementById('nextQBtn');
  if (next) next.addEventListener('click', () => navigateTo(currentSlide + 1));

  const finish = document.getElementById('finishBtn');
  if (finish) finish.addEventListener('click', () => {
    quizState.submitted = true;
    navigateTo(RESULTS_IDX);
  });
}

// =====================================================================
// RESULTS
// =====================================================================

function calcScore() {
  let correct = 0;
  let incorrect = 0;
  let unanswered = 0;
  quizQuestions.forEach((q, i) => {
    if (!quizState.locked[i]) unanswered++;
    else if (quizState.answers[i] === q.correct) correct++;
    else incorrect++;
  });
  const pct = Math.round((correct / quizQuestions.length) * 100);
  return { correct, incorrect, unanswered, pct };
}

function gradeMessage(pct) {
  if (pct === 100) return { color: C.ok, msg: '¡Perfecto!', detail: 'Dominas a fondo los árboles AVL. Excelente trabajo.', grade: 'A+' };
  if (pct >= 90) return { color: C.ok, msg: 'Excelente', detail: 'Comprensión sólida con muy pocos detalles por reforzar.', grade: 'A' };
  if (pct >= 80) return { color: C.ok, msg: 'Muy bien', detail: 'Buen dominio del tema; revisa los puntos que fallaste.', grade: 'B' };
  if (pct >= 70) return { color: C.accent, msg: 'Bien', detail: 'Hay comprensión, pero conviene repasar algunos conceptos.', grade: 'C' };
  if (pct >= 60) return { color: C.accent, msg: 'Suficiente', detail: 'Aprobado, pero te recomiendo repasar los temas marcados.', grade: 'D' };
  return { color: C.red, msg: 'A repasar', detail: 'Hay conceptos importantes que debes revisar antes de continuar.', grade: 'F' };
}

function renderResults() {
  const { correct, incorrect, unanswered, pct } = calcScore();
  const grade = gradeMessage(pct);
  const circumference = 2 * Math.PI * 80;
  const offset = circumference * (1 - pct / 100);

  const reviewItems = quizQuestions.map((q, i) => {
    if (!quizState.locked[i]) return null;
    const ok = quizState.answers[i] === q.correct;
    return `
      <div class="review-item ${ok ? '' : 'bad'}">
        <div class="q">${i + 1}. ${q.q}</div>
        <div class="a ${ok ? '' : 'your'}">${ok ? '✓' : '✗'} Tu respuesta: ${String.fromCharCode(65 + quizState.answers[i])}) ${q.options[quizState.answers[i]]}</div>
        ${!ok ? `<div class="a correct-a">✓ Correcta: ${String.fromCharCode(65 + q.correct)}) ${q.options[q.correct]}</div>` : ''}
      </div>
    `;
  }).filter(Boolean).join('');

  return `
    <div class="results">
      <p style="font-size: 11px; letter-spacing: 0.2em; color: ${C.gray}; text-transform: uppercase; margin-bottom: 6px;">CALIFICACIÓN FINAL</p>
      <div class="score-display">
        <svg width="200" height="200" viewBox="0 0 200 200">
          <circle class="track" cx="100" cy="100" r="80"/>
          <circle class="progress" cx="100" cy="100" r="80"
            stroke="${grade.color}"
            stroke-dasharray="${circumference}"
            stroke-dashoffset="${offset}"/>
        </svg>
        <div class="score-text">
          <div class="score-percentage" style="color: ${grade.color};">${pct}<span style="font-size: 28px;">%</span></div>
          <div class="score-grade-label">Calificación ${grade.grade}</div>
        </div>
      </div>
      <div class="score-message" style="color: ${grade.color};">${grade.msg}</div>
      <p class="score-detail">${grade.detail}</p>

      <div class="breakdown">
        <div class="breakdown-item ok">
          <div class="num">${correct}</div>
          <div class="lbl">Correctas</div>
        </div>
        <div class="breakdown-item bad">
          <div class="num">${incorrect}</div>
          <div class="lbl">Incorrectas</div>
        </div>
        <div class="breakdown-item total">
          <div class="num">${correct}/${quizQuestions.length}</div>
          <div class="lbl">${unanswered > 0 ? unanswered + ' sin responder' : 'Total'}</div>
        </div>
      </div>

      ${reviewItems ? `
        <div class="review-section">
          <h3>📋 Repaso de tus respuestas</h3>
          ${reviewItems}
        </div>
      ` : ''}

      <div class="results-actions">
        <button class="btn outline" id="reviewLessonBtn">📚 Volver a la lección</button>
        <button class="btn" id="retryBtn">🔄 Reintentar quiz</button>
        <button class="btn accent" id="printBtn">🖨️ Imprimir resultados</button>
      </div>
    </div>
  `;
}

function attachResultsHandlers() {
  document.getElementById('reviewLessonBtn').addEventListener('click', () => navigateTo(0));
  document.getElementById('retryBtn').addEventListener('click', () => {
    quizState.answers = new Array(quizQuestions.length).fill(null);
    quizState.locked = new Array(quizQuestions.length).fill(false);
    quizState.submitted = false;
    navigateTo(QUIZ_INTRO_IDX);
  });
  document.getElementById('printBtn').addEventListener('click', () => window.print());
}

// =====================================================================
// Quiz intro handler
// =====================================================================
document.addEventListener('click', (e) => {
  if (e.target.id === 'startQuizBtn') {
    // jump to first unanswered or first question
    const firstUnanswered = quizState.locked.findIndex(v => !v);
    const targetQ = firstUnanswered === -1 ? 0 : firstUnanswered;
    navigateTo(FIRST_QUIZ_Q_IDX + targetQ);
  }
});

// =====================================================================
// INIT
// =====================================================================
buildSidebar();
buildDots();
renderSlide();
</script>

</body>
</html>
