<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Requerimientos: Funcionales, No Funcionales y de Dominio</title>
<style>
  :root {
    --primary: #1E2761;
    --primary-light: #2F3C7E;
    --secondary: #CADCFC;
    --accent: #F96167;
    --gold: #F9E795;
    --bg: #F7F8FC;
    --card: #FFFFFF;
    --text: #1A1F36;
    --muted: #5A6378;
    --border: #E1E5EE;
    --success: #2C8C5A;
    --error: #C0392B;
    --func: #2F3C7E;
    --nofunc: #028090;
    --dom: #B85042;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', Calibri, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
  }

  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
  }

  header.app-header {
    background: var(--primary);
    color: white;
    padding: 18px 28px;
    border-radius: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
    box-shadow: 0 4px 14px rgba(30, 39, 97, 0.18);
  }

  header.app-header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  header.app-header .subtitle {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 2px;
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-track {
    width: 180px;
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 6px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.4s ease;
    border-radius: 6px;
  }

  .progress-label {
    font-size: 13px;
    font-weight: 600;
    min-width: 55px;
    text-align: right;
  }

  /* Slide card */
  .slide-card {
    background: var(--card);
    border-radius: 16px;
    padding: 40px 48px;
    min-height: 520px;
    box-shadow: 0 6px 20px rgba(30, 39, 97, 0.08);
    border: 1px solid var(--border);
    animation: fadeIn 0.45s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .slide-eyebrow {
    display: inline-block;
    background: var(--secondary);
    color: var(--primary);
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 18px;
  }

  .slide-title {
    font-family: Georgia, 'Cambria', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 12px;
    line-height: 1.2;
  }

  .slide-subtitle {
    color: var(--muted);
    font-size: 16px;
    margin-bottom: 28px;
  }

  .slide-body p { margin-bottom: 14px; font-size: 15px; }
  .slide-body strong { color: var(--primary); }

  /* Grid layouts */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 18px; }
  .grid-2-uneven { display: grid; grid-template-columns: 1fr 1.4fr; gap: 22px; margin-top: 18px; }

  .info-card {
    background: #F7F9FE;
    border-left: 4px solid var(--primary-light);
    padding: 16px 18px;
    border-radius: 8px;
  }

  .info-card h4 {
    color: var(--primary);
    font-size: 15px;
    margin-bottom: 6px;
    font-weight: 700;
  }

  .info-card p { font-size: 13.5px; color: var(--muted); margin: 0; }

  /* Agenda items */
  .agenda-item {
    display: grid;
    grid-template-columns: 50px 70px 1fr;
    gap: 14px;
    padding: 12px 14px;
    background: #F7F9FE;
    border-radius: 8px;
    margin-bottom: 8px;
    align-items: center;
  }

  .agenda-num {
    background: var(--primary);
    color: white;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }

  .agenda-time {
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
  }

  .agenda-content strong { display: block; color: var(--primary); margin-bottom: 2px; }
  .agenda-content span { font-size: 13px; color: var(--muted); }

  /* Three types big cards */
  .three-types {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-top: 22px;
  }

  .type-card {
    padding: 26px 20px;
    border-radius: 12px;
    color: white;
    text-align: center;
  }

  .type-card.func { background: linear-gradient(135deg, #2F3C7E, #1E2761); }
  .type-card.nofunc { background: linear-gradient(135deg, #028090, #065A82); }
  .type-card.dom { background: linear-gradient(135deg, #B85042, #8B3A2F); }

  .type-card h3 {
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 8px;
    opacity: 0.9;
  }

  .type-card p { font-size: 18px; font-weight: 600; }

  /* Characteristics */
  .char-item {
    display: flex;
    gap: 14px;
    padding: 12px;
    background: #F7F9FE;
    border-radius: 8px;
    margin-bottom: 8px;
  }

  .char-letter {
    background: var(--primary);
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }

  .char-content strong { color: var(--primary); display: block; }
  .char-content span { font-size: 13px; color: var(--muted); }

  /* Template box */
  .template-box {
    background: var(--primary);
    color: white;
    padding: 20px 24px;
    border-radius: 12px;
    font-family: Consolas, 'Courier New', monospace;
    font-size: 15px;
    margin: 18px 0;
    line-height: 1.6;
  }

  .template-box .label {
    display: block;
    font-family: 'Segoe UI', sans-serif;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 8px;
  }

  /* Requirement examples */
  .req-example {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 12px;
    padding: 12px;
    background: #FAFBFE;
    border-left: 3px solid var(--primary);
    border-radius: 6px;
    margin-bottom: 10px;
    font-size: 14px;
  }

  .req-id {
    background: var(--primary);
    color: white;
    padding: 4px 8px;
    border-radius: 4px;
    text-align: center;
    font-weight: 700;
    font-size: 12px;
    height: fit-content;
  }

  /* Tables */
  table.req-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 16px;
    font-size: 13.5px;
  }

  table.req-table th {
    background: var(--primary);
    color: white;
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
  }

  table.req-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  table.req-table tr:nth-child(even) td { background: #FAFBFE; }

  /* Comparison no/si */
  .comparison-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin-top: 18px;
  }

  .col-bad {
    background: #FDF2F2;
    border: 1px solid #F5C2C2;
    border-radius: 10px;
    padding: 18px;
  }

  .col-good {
    background: #F0F9F4;
    border: 1px solid #C2E6CF;
    border-radius: 10px;
    padding: 18px;
  }

  .col-bad h4, .col-good h4 {
    font-size: 14px;
    margin-bottom: 12px;
    font-weight: 700;
  }

  .col-bad h4 { color: var(--error); }
  .col-good h4 { color: var(--success); }

  .col-bad p, .col-good p {
    font-size: 13px;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(0,0,0,0.08);
  }

  .col-bad p:last-child, .col-good p:last-child { border: none; }

  /* Sector cards */
  .sector-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 5px solid var(--accent);
    padding: 14px 16px;
    border-radius: 8px;
    margin-bottom: 10px;
  }

  .sector-card h4 {
    color: var(--primary);
    margin-bottom: 6px;
    font-size: 14px;
  }

  .sector-card p { font-size: 13px; color: var(--muted); margin-bottom: 4px; }

  /* Buttons / navigation */
  .nav-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 22px;
    gap: 12px;
  }

  .btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 12px 26px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .btn:hover:not(:disabled) {
    background: var(--primary-light);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(30, 39, 97, 0.25);
  }

  .btn:disabled {
    background: #C5C9D4;
    cursor: not-allowed;
    opacity: 0.7;
  }

  .btn-accent { background: var(--accent); }
  .btn-accent:hover:not(:disabled) { background: #E04A50; }

  .btn-ghost {
    background: white;
    color: var(--primary);
    border: 1.5px solid var(--primary);
  }

  .btn-ghost:hover:not(:disabled) { background: var(--secondary); }

  .slide-counter {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  /* Quiz styles */
  .quiz-intro {
    text-align: center;
    padding: 40px 20px;
  }

  .quiz-intro .icon {
    font-size: 56px;
    margin-bottom: 16px;
  }

  .quiz-intro h2 {
    font-family: Georgia, serif;
    font-size: 30px;
    color: var(--primary);
    margin-bottom: 14px;
  }

  .quiz-intro p {
    color: var(--muted);
    max-width: 580px;
    margin: 0 auto 20px;
    font-size: 15px;
  }

  .quiz-features {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    max-width: 700px;
    margin: 30px auto;
  }

  .quiz-feature {
    background: #F7F9FE;
    padding: 16px;
    border-radius: 10px;
    text-align: center;
  }

  .quiz-feature .feat-num {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
  }

  .quiz-feature .feat-label {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  .quiz-question {
    margin-bottom: 24px;
  }

  .quiz-question .q-number {
    color: var(--accent);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
  }

  .quiz-question .q-text {
    font-size: 17px;
    color: var(--primary);
    font-weight: 600;
    margin: 8px 0 18px;
    line-height: 1.4;
  }

  .quiz-question .q-context {
    background: #F7F9FE;
    border-left: 3px solid var(--primary-light);
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 14px;
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
  }

  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .quiz-option {
    background: white;
    border: 1.5px solid var(--border);
    padding: 14px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14.5px;
    text-align: left;
    transition: all 0.2s ease;
    font-family: inherit;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .quiz-option:hover {
    border-color: var(--primary);
    background: #F7F9FE;
  }

  .quiz-option.selected {
    border-color: var(--primary);
    background: var(--secondary);
    color: var(--primary);
    font-weight: 600;
  }

  .quiz-option.correct {
    border-color: var(--success);
    background: #E8F5EE;
    color: var(--success);
    font-weight: 600;
  }

  .quiz-option.incorrect {
    border-color: var(--error);
    background: #FDECEA;
    color: var(--error);
  }

  .option-letter {
    background: var(--secondary);
    color: var(--primary);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }

  .quiz-option.selected .option-letter { background: var(--primary); color: white; }
  .quiz-option.correct .option-letter { background: var(--success); color: white; }
  .quiz-option.incorrect .option-letter { background: var(--error); color: white; }

  .feedback {
    margin-top: 16px;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 14px;
    display: none;
  }

  .feedback.show { display: block; animation: fadeIn 0.3s ease; }
  .feedback.right { background: #E8F5EE; color: var(--success); border-left: 4px solid var(--success); }
  .feedback.wrong { background: #FDECEA; color: var(--error); border-left: 4px solid var(--error); }

  .feedback strong { display: block; margin-bottom: 4px; }

  /* Results */
  .results-screen {
    text-align: center;
    padding: 30px 20px;
  }

  .score-circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    margin: 20px auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: conic-gradient(var(--gold) 0%, var(--gold) var(--score-pct), #E1E5EE var(--score-pct), #E1E5EE 100%);
    position: relative;
  }

  .score-inner {
    width: 150px;
    height: 150px;
    background: white;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .score-number {
    font-size: 50px;
    font-weight: 700;
    color: var(--primary);
    font-family: Georgia, serif;
    line-height: 1;
  }

  .score-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  .grade-badge {
    display: inline-block;
    padding: 8px 20px;
    border-radius: 24px;
    font-weight: 700;
    font-size: 14px;
    margin: 10px 0 20px;
  }

  .grade-excellent { background: #D4EDDA; color: #155724; }
  .grade-good { background: #FFF3CD; color: #856404; }
  .grade-fail { background: #F8D7DA; color: #721C24; }

  .results-summary {
    background: #F7F9FE;
    padding: 20px;
    border-radius: 12px;
    margin: 20px 0;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed var(--border);
    font-size: 14px;
  }

  .summary-row:last-child { border: none; }
  .summary-row span:first-child { color: var(--muted); }
  .summary-row span:last-child { font-weight: 700; color: var(--primary); }

  .review-list {
    text-align: left;
    margin: 20px auto;
    max-width: 700px;
  }

  .review-item {
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 8px;
    border-left: 4px solid;
    font-size: 13.5px;
  }

  .review-item.right { background: #F0F9F4; border-color: var(--success); }
  .review-item.wrong { background: #FDF2F2; border-color: var(--error); }
  .review-item .q { font-weight: 600; color: var(--primary); margin-bottom: 4px; }
  .review-item .ans { color: var(--muted); font-size: 12.5px; }
  .review-item .ans strong { color: var(--text); }

  /* Closing slide */
  .key-ideas { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .key-idea {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 14px;
    background: #F7F9FE;
    padding: 14px 16px;
    border-radius: 8px;
    align-items: center;
  }
  .key-idea .num {
    background: var(--accent);
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
  }
  .key-idea p { margin: 0; font-size: 14px; }

  /* Sidebar / TOC for desktop */
  .toc-toggle {
    background: none;
    border: 1px solid white;
    color: white;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
  }

  .toc-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(30, 39, 97, 0.6);
    z-index: 100;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 60px;
  }

  .toc-overlay.open { display: flex; }

  .toc-panel {
    background: white;
    border-radius: 14px;
    padding: 24px;
    max-width: 500px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .toc-panel h3 {
    color: var(--primary);
    margin-bottom: 14px;
    font-family: Georgia, serif;
  }

  .toc-list { list-style: none; }

  .toc-list li {
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    font-size: 14px;
    color: var(--text);
    transition: background 0.2s;
  }

  .toc-list li:hover { background: var(--secondary); }
  .toc-list li.active { background: var(--primary); color: white; font-weight: 600; }
  .toc-list li.quiz-item { border-top: 2px solid var(--border); padding-top: 14px; margin-top: 8px; color: var(--accent); font-weight: 600; }

  @media (max-width: 720px) {
    .slide-card { padding: 24px 22px; min-height: 400px; }
    .slide-title { font-size: 24px; }
    .grid-2, .grid-3, .comparison-cols, .three-types, .quiz-features, .grid-2-uneven {
      grid-template-columns: 1fr;
    }
    header.app-header { flex-direction: column; gap: 10px; }
    .progress-track { width: 140px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="app-header">
    <div>
      <h1>Requerimientos Funcionales, No Funcionales y de Dominio</h1>
      <div class="subtitle">Ingeniería de Requerimientos · UAEMéx</div>
    </div>
    <div class="progress-wrap">
      <button class="toc-toggle" id="tocBtn">☰ Índice</button>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">0%</div>
    </div>
  </header>

  <div class="slide-card" id="slideCard"></div>

  <div class="nav-bar">
    <button class="btn btn-ghost" id="prevBtn">← Anterior</button>
    <div class="slide-counter" id="slideCounter">1 / 23</div>
    <button class="btn" id="nextBtn">Siguiente →</button>
  </div>
</div>

<div class="toc-overlay" id="tocOverlay">
  <div class="toc-panel">
    <h3>Índice de la sesión</h3>
    <ul class="toc-list" id="tocList"></ul>
  </div>
</div>

<script>
// ============ CONTENIDO DE DIAPOSITIVAS ============
const slides = [
  {
    title: "Requerimientos Funcionales, No Funcionales y de Dominio",
    eyebrow: "PORTADA",
    html: `
      <p style="font-size:17px; color:var(--muted); margin-bottom:24px;">
        Conceptos esenciales y ejemplos prácticos para identificar, clasificar y especificar requerimientos en proyectos de software.
      </p>
      <div class="three-types">
        <div class="type-card func">
          <h3>FUNCIONALES</h3>
          <p>Qué hace el sistema</p>
        </div>
        <div class="type-card nofunc">
          <h3>NO FUNCIONALES</h3>
          <p>Cómo lo hace</p>
        </div>
        <div class="type-card dom">
          <h3>DE DOMINIO</h3>
          <p>Qué reglas aplican</p>
        </div>
      </div>
      <p style="margin-top:30px; color:var(--muted); font-size:14px; text-align:right;">
        <strong style="color:var(--primary);">M. en A.E.G. Beatriz Orozco Garduño</strong><br>
        Facultad de Ingeniería · UAEMéx
      </p>
    `
  },
  {
    eyebrow: "RUTA DE LA SESIÓN",
    title: "Agenda de la clase",
    subtitle: "120 minutos · 6 momentos",
    html: `
      <div class="agenda-item"><div class="agenda-num">1</div><div class="agenda-time">10 min</div><div class="agenda-content"><strong>Encuadre</strong><span>Objetivos, contexto y por qué importa la ingeniería de requerimientos.</span></div></div>

        </div>
        <p style="font-size:13px; color:var(--muted);">Recibirás retroalimentación inmediata al responder cada pregunta.</p>
      </div>
    `
  }
];

// ============ PREGUNTAS DEL CUESTIONARIO ============
const questions = [
  {
    text: "¿Cuál es la pregunta clave que responde un requerimiento funcional?",
    options: [
      "¿Qué tan bien lo hace el sistema?",
      "¿Qué hace el sistema cuando el usuario hace X?",
      "¿Qué reglas del negocio aplican?",
      "¿Con qué tecnología se construirá?"
    ],
    correct: 1,
    feedback: "Los requerimientos funcionales describen QUÉ debe hacer el sistema en respuesta a eventos o acciones del usuario."
  },
  {
    text: "Clasifica este requerimiento: \"El sistema deberá responder a una consulta en menos de 2 segundos con hasta 500 usuarios concurrentes\".",
    options: [
      "Funcional (RF)",
      "No funcional (RNF)",
      "De dominio (RD)",
      "Restricción técnica"
    ],
    correct: 1,
    feedback: "Es un requerimiento no funcional de rendimiento porque define CÓMO debe comportarse el sistema con una métrica medible (2 s, 500 usuarios)."
  },
  {
    text: "Clasifica: \"Un alumno solo puede inscribir una UA si tiene aprobada la UA prerrequisito según el plan vigente\".",
    options: [
      "Funcional (RF)",
      "No funcional (RNF)",
      "De dominio (RD)",
      "Caso de uso"
    ],
    correct: 2,
    feedback: "Es de dominio porque surge de una regla específica del sector educativo (reglamento UAEMéx), no de una preferencia del usuario."
  },
  {
    text: "¿Cuál de estas NO es una característica de un buen requerimiento?",
    options: [
      "Verificable",
      "Trazable",
      "Ambiguo",
      "Consistente"
    ],
    correct: 2,
    feedback: "Ambiguo es lo opuesto a lo que se busca. Un buen requerimiento debe ser claro, completo, consistente, verificable, factible y trazable."
  },
  {
    text: "Identifica la versión CORRECTAMENTE redactada de un requerimiento no funcional:",
    context: "Las dos versiones se refieren al mismo atributo de calidad.",
    options: [
      "El sistema debe ser rápido y eficiente.",
      "La interfaz debe ser amigable y fácil de usar.",
      "El sistema deberá responder en ≤ 2 segundos al 95% de las consultas con 500 usuarios concurrentes.",
      "Debe estar disponible casi siempre."
    ],
    correct: 2,
    feedback: "La opción correcta incluye métricas precisas (≤ 2 s, 95% de consultas, 500 usuarios), lo que la hace verificable. Las demás son ambiguas."
  },
  {
    text: "Clasifica: \"El sistema deberá generar un comprobante PDF con el horario al confirmar la inscripción\".",
    options: [
      "Funcional (RF)",
      "No funcional (RNF)",
      "De dominio (RD)",
      "Restricción legal"
    ],
    correct: 0,
    feedback: "Es funcional: describe QUÉ hace el sistema (generar comprobante) y bajo qué condición (al confirmar inscripción)."
  },
  {
    text: "Clasifica: \"Toda operación mayor a $7,500 USD debe reportarse a la unidad de inteligencia financiera (PLD/AML)\".",
    options: [
      "Funcional (RF)",
      "No funcional (RNF)",
      "De dominio (RD)",
      "Requerimiento de usabilidad"
    ],
    correct: 2,
    feedback: "Es de dominio: surge de una regulación específica del sector bancario (PLD/AML) que el sistema está obligado a respetar."
  },
  {
    text: "¿Cuál es la plantilla recomendada para redactar un requerimiento funcional?",
    options: [
      "El usuario quiere [acción] para [beneficio].",
      "El sistema deberá [acción en infinitivo] el [objeto] cuando [condición/evento].",
      "Como [rol], necesito [funcionalidad] porque [razón].",
      "Cuando [evento], entonces [resultado]."
    ],
    correct: 1,
    feedback: "Esa es la plantilla profesional vista en clase: usa verbo en infinitivo, identifica el objeto y la condición de disparo."
  },
  {
    text: "Clasifica: \"La app deberá funcionar sin conexión a internet y sincronizar al recuperarla\".",
    options: [
      "Funcional (RF)",
      "No funcional (RNF)",
      "De dominio (RD)",
      "Es ambiguo, no se puede clasificar"
    ],
    correct: 1,
    feedback: "Es no funcional: describe un atributo de calidad (disponibilidad/confiabilidad) que aplica al sistema en su conjunto, no a una función específica."
  },
  {
    text: "¿Cuál es el RIESGO TÍPICO con los requerimientos de dominio?",
    options: [
      "Que sean demasiado técnicos y los stakeholders no los entiendan.",
      "Que los expertos del dominio los omitan por considerarlos 'obvios', causando incumplimiento normativo.",
      "Que sean imposibles de medir con métricas.",
      "Que dupliquen los requerimientos funcionales."
    ],
    correct: 1,
    feedback: "Exacto. Los expertos del dominio suelen darlos por sentados, lo que provoca sistemas que violan reglas legales o tienen cálculos incorrectos en producción."
  }
];

// ============ ESTADO DE LA APLICACIÓN ============
const state = {
  currentSlide: 0,
  inQuiz: false,
  currentQuestion: 0,
  answers: [],
  quizFinished: false
};

const totalSlides = slides.length;
const totalQuestions = questions.length;

// Elementos del DOM
const slideCard = document.getElementById('slideCard');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const slideCounter = document.getElementById('slideCounter');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const tocBtn = document.getElementById('tocBtn');
const tocOverlay = document.getElementById('tocOverlay');
const tocList = document.getElementById('tocList');

// Renderizar índice
function buildTOC() {
  tocList.innerHTML = '';
  slides.forEach((slide, i) => {
    const li = document.createElement('li');
    li.textContent = `${i + 1}. ${slide.title}`;
    li.dataset.index = i;
    li.onclick = () => {
      state.inQuiz = false;
      state.quizFinished = false;
      state.currentSlide = i;
      tocOverlay.classList.remove('open');
      render();
    };
    tocList.appendChild(li);
  });
  const quizLi = document.createElement('li');
  quizLi.className = 'quiz-item';
  quizLi.textContent = '🎯 Ir al cuestionario';
  quizLi.onclick = () => {
    state.currentSlide = slides.length - 1;
    state.inQuiz = false;
    state.quizFinished = false;
    tocOverlay.classList.remove('open');
    render();
  };
  tocList.appendChild(quizLi);
}

tocBtn.onclick = () => tocOverlay.classList.toggle('open');
tocOverlay.onclick = (e) => { if (e.target === tocOverlay) tocOverlay.classList.remove('open'); };

// Renderizar slide
function renderSlide() {
  const slide = slides[state.currentSlide];
  let html = '';
  if (slide.eyebrow) html += `<div class="slide-eyebrow">${slide.eyebrow}</div>`;
  if (slide.title) html += `<h2 class="slide-title">${slide.title}</h2>`;
  if (slide.subtitle) html += `<div class="slide-subtitle">${slide.subtitle}</div>`;
  html += `<div class="slide-body">${slide.html}</div>`;
  slideCard.innerHTML = html;

  slideCounter.textContent = `${state.currentSlide + 1} / ${totalSlides}`;
  const pct = ((state.currentSlide + 1) / totalSlides) * 100;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = Math.round(pct) + '%';

  prevBtn.disabled = state.currentSlide === 0;

  const isLastSlide = state.currentSlide === totalSlides - 1;
  if (isLastSlide) {
    nextBtn.textContent = '🎯 Comenzar cuestionario';
    nextBtn.classList.add('btn-accent');
  } else {
    nextBtn.textContent = 'Siguiente →';
    nextBtn.classList.remove('btn-accent');
  }
  nextBtn.disabled = false;

  // Actualizar TOC activo
  document.querySelectorAll('.toc-list li').forEach((li, i) => {
    li.classList.toggle('active', i === state.currentSlide);
  });
}

// Renderizar pregunta del quiz
function renderQuestion() {
  const q = questions[state.currentQuestion];
  const selected = state.answers[state.currentQuestion];
  const answered = selected !== undefined;

  let optionsHtml = q.options.map((opt, i) => {
    let cls = 'quiz-option';
    const letter = String.fromCharCode(65 + i);
    if (answered) {
      if (i === q.correct) cls += ' correct';
      else if (i === selected) cls += ' incorrect';
    } else if (selected === i) {
      cls += ' selected';
    }
    return `<button class="${cls}" data-idx="${i}" ${answered ? 'disabled' : ''}>
      <span class="option-letter">${letter}</span>
      <span>${opt}</span>
    </button>`;
  }).join('');

  const feedbackHtml = answered ? `
    <div class="feedback show ${selected === q.correct ? 'right' : 'wrong'}">
      <strong>${selected === q.correct ? '✓ ¡Correcto!' : '✗ Incorrecto'}</strong>
      ${q.feedback}
    </div>
  ` : '';

  const contextHtml = q.context ? `<div class="q-context">${q.context}</div>` : '';

  slideCard.innerHTML = `
    <div class="slide-eyebrow">CUESTIONARIO · PREGUNTA ${state.currentQuestion + 1} DE ${totalQuestions}</div>
    <div class="quiz-question">
      <div class="q-number">PREGUNTA ${state.currentQuestion + 1}</div>
      <div class="q-text">${q.text}</div>
      ${contextHtml}
      <div class="quiz-options">${optionsHtml}</div>
      ${feedbackHtml}
    </div>
  `;

  document.querySelectorAll('.quiz-option').forEach(btn => {
    btn.onclick = () => {
      if (state.answers[state.currentQuestion] === undefined) {
        state.answers[state.currentQuestion] = parseInt(btn.dataset.idx);
        renderQuestion();
      }
    };
  });

  // Counter & buttons
  slideCounter.textContent = `Pregunta ${state.currentQuestion + 1} / ${totalQuestions}`;
  const pct = ((state.currentQuestion + 1) / totalQuestions) * 100;
  progressFill.style.width = pct + '%';
  progressLabel.textContent = Math.round(pct) + '%';

  prevBtn.disabled = state.currentQuestion === 0;

  const isLast = state.currentQuestion === totalQuestions - 1;
  if (isLast) {
    nextBtn.textContent = '📊 Ver calificación';
    nextBtn.classList.add('btn-accent');
  } else {
    nextBtn.textContent = 'Siguiente pregunta →';
    nextBtn.classList.remove('btn-accent');
  }
  nextBtn.disabled = !answered;
}

// Pantalla de resultados
function renderResults() {
  const correctCount = state.answers.filter((a, i) => a === questions[i].correct).length;
  const score10 = (correctCount / totalQuestions) * 10;
  const pct = (correctCount / totalQuestions) * 100;
  const passed = score10 >= 6.0;

  let gradeBadge, gradeLabel, gradeClass;
  if (score10 >= 9) { gradeBadge = 'Excelente'; gradeClass = 'grade-excellent'; gradeLabel = '🏆 ¡Dominio sobresaliente!'; }
  else if (score10 >= 8) { gradeBadge = 'Muy bien'; gradeClass = 'grade-excellent'; gradeLabel = '👏 Buen dominio del tema'; }
  else if (score10 >= 6) { gradeBadge = 'Aprobado'; gradeClass = 'grade-good'; gradeLabel = '✓ Has aprobado, revisa los errores'; }
  else { gradeBadge = 'Reprobado'; gradeClass = 'grade-fail'; gradeLabel = '📚 Necesitas repasar el material'; }

  const reviewHtml = questions.map((q, i) => {
    const ans = state.answers[i];
    const ok = ans === q.correct;
    return `
      <div class="review-item ${ok ? 'right' : 'wrong'}">
        <div class="q">${ok ? '✓' : '✗'} P${i+1}. ${q.text}</div>
        <div class="ans">
          <strong>Tu respuesta:</strong> ${q.options[ans]}<br>
          ${!ok ? `<strong>Correcta:</strong> ${q.options[q.correct]}` : ''}
        </div>
      </div>
    `;
  }).join('');

  slideCard.innerHTML = `
    <div class="results-screen">
      <div class="slide-eyebrow">RESULTADOS</div>
      <h2 class="slide-title">${gradeLabel}</h2>
      <div class="score-circle" style="--score-pct: ${pct}%;">
        <div class="score-inner">
          <div class="score-number">${score10.toFixed(1)}</div>
          <div class="score-label">DE 10.0</div>
        </div>
      </div>
      <div class="grade-badge ${gradeClass}">${gradeBadge}</div>
      <div class="results-summary">
        <div class="summary-row"><span>Respuestas correctas</span><span>${correctCount} / ${totalQuestions}</span></div>
        <div class="summary-row"><span>Porcentaje de aciertos</span><span>${pct.toFixed(0)}%</span></div>
        <div class="summary-row"><span>Calificación (escala 0-10)</span><span>${score10.toFixed(1)}</span></div>
        <div class="summary-row"><span>Estatus</span><span style="color:${passed ? 'var(--success)' : 'var(--error)'};">${passed ? 'APROBADO' : 'NO APROBADO'}</span></div>
      </div>
      <h3 style="color:var(--primary); margin:20px 0 10px; font-family:Georgia,serif;">Revisión de respuestas</h3>
      <div class="review-list">${reviewHtml}</div>
      <div style="margin-top:20px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-ghost" id="reviewBtn">📖 Repasar diapositivas</button>
        <button class="btn btn-accent" id="retryBtn">🔄 Intentar de nuevo</button>
      </div>
    </div>
  `;

  document.getElementById('reviewBtn').onclick = () => {
    state.inQuiz = false;
    state.quizFinished = false;
    state.currentSlide = 0;
    render();
  };
  document.getElementById('retryBtn').onclick = () => {
    state.answers = [];
    state.currentQuestion = 0;
    state.quizFinished = false;
    state.inQuiz = true;
    render();
  };

  slideCounter.textContent = `Resultado final`;
  progressFill.style.width = '100%';
  progressLabel.textContent = '100%';
  prevBtn.disabled = false;
  nextBtn.disabled = true;
  nextBtn.textContent = '✓ Finalizado';
  nextBtn.classList.remove('btn-accent');
}

// Render principal
function render() {
  if (state.quizFinished) {
    renderResults();
  } else if (state.inQuiz) {
    renderQuestion();
  } else {
    renderSlide();
  }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Navegación
prevBtn.onclick = () => {
  if (state.quizFinished) {
    state.quizFinished = false;
    state.inQuiz = true;
    state.currentQuestion = totalQuestions - 1;
  } else if (state.inQuiz) {
    if (state.currentQuestion > 0) {
      state.currentQuestion--;
    } else {
      state.inQuiz = false;
      state.currentSlide = totalSlides - 1;
    }
  } else if (state.currentSlide > 0) {
    state.currentSlide--;
  }
  render();
};

nextBtn.onclick = () => {
  if (state.inQuiz) {
    if (state.answers[state.currentQuestion] === undefined) return;
    if (state.currentQuestion < totalQuestions - 1) {
      state.currentQuestion++;
    } else {
      state.quizFinished = true;
    }
  } else if (state.currentSlide < totalSlides - 1) {
    state.currentSlide++;
  } else {
    // Pasar al quiz
    state.inQuiz = true;
    state.currentQuestion = 0;
    state.answers = [];
  }
  render();
};

// Soporte de teclado
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
  if (e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
});

// Init
buildTOC();
render();
</script>
</body>
</html>
